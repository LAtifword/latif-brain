<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LATIF Model Flex</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui}main{max-width:720px;margin:auto;padding:18px}h1{font-size:24px}.card{background:#1b1b1b;border:1px solid #333;border-radius:16px;padding:14px;margin:12px 0}textarea{width:100%;box-sizing:border-box;background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;min-height:120px;font:inherit}button{background:#e5b85c;color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;margin-top:10px}pre{white-space:pre-wrap;line-height:1.5}.meta{color:#aaa;font-size:13px}</style></head><body><main><h1>LATIF Model Flex</h1><div class="meta">Cost-aware personal agent · auto routes routine tasks to the cheap model</div><div class="card"><textarea id="input" placeholder="Ask LATIF to summarize, plan, write, analyze, or help..."></textarea><button id="send">Run task</button></div><div class="card"><div id="status" class="meta">Ready</div><pre id="output"></pre></div></main><script>const input=document.querySelector('#input'),out=document.querySelector('#output'),status=document.querySelector('#status');document.querySelector('#send').onclick=async()=>{const message=input.value.trim();if(!message)return;status.textContent='Working…';out.textContent='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');out.textContent=data.text;status.textContent=`Route: ${data.route} · ${data.provider}/${data.model}`;}catch(e){status.textContent='Error';out.textContent=e.message;}};</script></body></html>
