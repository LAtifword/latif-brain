plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.latif.suite'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions += 'surface'
    productFlavors {
        gx {
            dimension 'surface'
            applicationId 'com.latif.gx'
            versionName '2.0.0-standalone'
            resValue 'string', 'app_name', 'LATIF GX'
            buildConfigField 'String', 'START_PAGE', '"index.html"'
            buildConfigField 'boolean', 'LOCAL_AI_ENABLED', 'true'
            buildConfigField 'String', 'MODEL_ASSET', '"models/gx-qwen3-1.7b-int4.litertlm"'
            buildConfigField 'String', 'MODEL_LABEL', '"Qwen3 1.7B INT4 · Embedded"'
        }
        ni {
            dimension 'surface'
            applicationId 'com.latif.ni.dashboard'
            versionName '2.0.0-standalone'
            resValue 'string', 'app_name', 'LATIF NI'
            buildConfigField 'String', 'START_PAGE', '"latif-ni-dashboard.html"'
            buildConfigField 'boolean', 'LOCAL_AI_ENABLED', 'true'
            buildConfigField 'String', 'MODEL_ASSET', '"models/ni-qwen3-0.6b-int4.litertlm"'
            buildConfigField 'String', 'MODEL_LABEL', '"Qwen3 0.6B INT4 · Embedded"'
        }
        web {
            dimension 'surface'
            applicationId 'com.latif.web'
            versionName '1.0.0'
            resValue 'string', 'app_name', 'LATIF WEB'
            buildConfigField 'String', 'START_PAGE', '"latif-web.html"'
            buildConfigField 'boolean', 'LOCAL_AI_ENABLED', 'false'
            buildConfigField 'String', 'MODEL_ASSET', '""'
            buildConfigField 'String', 'MODEL_LABEL', '""'
        }
    }

    sourceSets {
        gx.assets.srcDirs = [rootProject.file('../latif-ai'), file('src/gx/assets')]
        ni.assets.srcDirs = [rootProject.file('../src/dashboards'), file('src/ni/assets')]
        web.assets.srcDirs = [rootProject.file('../src/dashboards')]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ['litertlm', 'onnx', 'bin']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0'
}
