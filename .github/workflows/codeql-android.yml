name: CodeQL Android Java and Kotlin
on:
  push:
    branches: [latif-brain]
    paths:
      - 'android/**'
      - '.github/workflows/codeql-android.yml'
  pull_request:
    branches: [latif-brain]
    paths:
      - 'android/**'
      - '.github/workflows/codeql-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android project for CodeQL
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :webapps:compileGxDebugKotlin :webapps:compileNiDebugKotlin :webapps:compileWebDebugKotlin
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin-android'
