name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK and signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" LATIF-BRAIN-final.apk
          sha256sum LATIF-BRAIN-final.apk | tee LATIF-BRAIN-final.apk.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: LATIF-BRAIN-final
          path: |
            LATIF-BRAIN-final.apk
            LATIF-BRAIN-final.apk.sha256
          if-no-files-found: error
          retention-days: 90
