name: Android APK Suite

on:
  push:
    branches:
      - latif-brain
      - main
      - build/all-ready-apks
      - standalone-native-ai
    paths:
      - 'android/**'
      - 'latif-ai/**'
      - 'src/dashboards/**'
      - '.github/workflows/android-apk.yml'
      - 'tools/verify-apk-model.py'
      - 'tests/test_apk_model_verifier.py'
  pull_request:
    paths:
      - 'android/**'
      - 'latif-ai/**'
      - 'src/dashboards/**'
      - '.github/workflows/android-apk.yml'
      - 'tools/verify-apk-model.py'
      - 'tests/test_apk_model_verifier.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GX_MODEL_URL: https://huggingface.co/litert-community/Qwen3-1.7B/resolve/79bf0667b32ae025b972e5fe555fe72ca6e8816c/Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm?download=true
      GX_MODEL_SHA256: 2a72330b504a6596d53a2c00923c57173b10f1b83e6a541213ffec08d1fc5de8
      NI_MODEL_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6687177e00897731e7716267eebd4eba0dde7c2/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm?download=true
      NI_MODEL_SHA256: 03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test embedded-model verification
        run: python3 -m unittest discover -s tests -p 'test_apk_model_verifier.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify embedded AI models
        shell: bash
        run: |
          set -euo pipefail
          GX_DIR="android/webapps/src/gx/assets/models"
          NI_DIR="android/webapps/src/ni/assets/models"
          mkdir -p "$GX_DIR" "$NI_DIR"

          verify_model() {
            local url="$1"
            local dst="$2"
            local expected="$3"
            local label="$4"

            for attempt in 1 2 3; do
              echo "Downloading $label (attempt $attempt/3)..."
              curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o "$dst" || true

              if [ -s "$dst" ]; then
                actual=$(sha256sum "$dst" | awk '{print $1}')
                echo "Downloaded $label to $dst"
                echo "Expected SHA256: $expected"
                echo "Actual SHA256:   $actual"

                if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
                  echo "ERROR: checksum mismatch for $label. Refusing unverified model."
                  echo "Checksum mismatch detected for $label, re-trying." >&2
                  rm -f "$dst"
                  sleep 2
                  continue
                fi

                if [ -n "$expected" ]; then
                  echo "$expected  $dst" | sha256sum -c -
                fi
                return 0
              fi

              echo "Download produced an empty file for $label (attempt $attempt/3)" >&2
              sleep 2
            done

            echo "ERROR: unable to fetch or verify $label after retries" >&2
            return 1
          }

          verify_model "$GX_MODEL_URL" "$GX_DIR/gx-qwen3-1.7b-int4.litertlm" "$GX_MODEL_SHA256" "GX model"
          verify_model "$NI_MODEL_URL" "$NI_DIR/ni-qwen3-0.6b-int4.litertlm" "$NI_MODEL_SHA256" "NI model"

          ls -lh "$GX_DIR" "$NI_DIR"

      - name: Build all installable APKs
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace clean \
            :app:assembleDebug \
            :webapps:assembleGxDebug \
            :webapps:assembleNiDebug \
            :webapps:assembleWebDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BRAIN_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          GX_APK="$(find android/webapps/build/outputs/apk/gx/debug -type f -name '*.apk' -print -quit)"
          NI_APK="$(find android/webapps/build/outputs/apk/ni/debug -type f -name '*.apk' -print -quit)"
          WEB_APK="$(find android/webapps/build/outputs/apk/web/debug -type f -name '*.apk' -print -quit)"

          test -f "$BRAIN_APK"
          test -f "$GX_APK"
          test -f "$NI_APK"
          test -f "$WEB_APK"

          cp "$BRAIN_APK" dist/LATIF-BRAIN-v1.1.0.apk
          cp "$GX_APK" dist/LATIF-GX-v2.0.0-STANDALONE.apk
          cp "$NI_APK" dist/LATIF-NI-v2.0.0-STANDALONE.apk
          cp "$WEB_APK" dist/LATIF-WEB-v1.0.0.apk

          ls -lh dist/

      - name: Verify APK integrity, signatures and bundled models
        shell: bash
        run: |
          set -euo pipefail
          for APK in dist/*.apk; do
            echo "Verifying $APK"
            unzip -t "$APK" >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          done

          python3 tools/verify-apk-model.py dist/LATIF-GX-v2.0.0-STANDALONE.apk assets/models/gx-qwen3-1.7b-int4.litertlm "$GX_MODEL_SHA256"
          python3 tools/verify-apk-model.py dist/LATIF-NI-v2.0.0-STANDALONE.apk assets/models/ni-qwen3-0.6b-int4.litertlm "$NI_MODEL_SHA256"

          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload ready-to-install APK suite
        uses: actions/upload-artifact@v4
        with:
          name: LATIF-STANDALONE-AI-APKS
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
